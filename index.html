<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nagesh Radio</title>
  <!-- HLS.js: Chrome/Firefox don't natively decode .m3u8 — this fixes the buffering -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13; --surface: #1a1a24; --card: #22222f;
      --border: #2e2e3e; --accent: #ff6b35; --accent2: #ff9a5c;
      --text: #e8e8f0; --muted: #7a7a9a; --player-h: 88px;
      --local: #1a2a1a; --local-border: #3a6a3a;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding-bottom: var(--player-h);
    }

    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 24px; display: flex; align-items: center; gap: 14px;
      position: sticky; top: 0; z-index: 10;
    }
    .logo { font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; flex-shrink: 0; }
    .logo span { color: var(--text); }

    /* ── Country tabs ── */
    .country-bar {
      display: flex; gap: 0; background: #0d0d11;
      border-bottom: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none;
    }
    .country-bar::-webkit-scrollbar { display: none; }
    .country-tab {
      flex-shrink: 0; padding: 11px 22px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      color: var(--muted); border-bottom: 3px solid transparent;
      transition: all 0.15s; display: flex; align-items: center; gap: 8px;
      white-space: nowrap;
    }
    .country-tab:hover { color: var(--text); }
    .country-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    #search {
      flex: 1; max-width: 360px; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 14px; color: var(--text); font-size: 14px; outline: none;
    }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--muted); }

    .state-bar {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 24px;
      scrollbar-width: none; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .state-bar::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 14px; font-size: 13px; cursor: pointer;
      transition: all 0.15s; color: var(--muted); white-space: nowrap;
    }
    .chip:hover { border-color: var(--accent); color: var(--text); }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .chip.local-chip { border-color: var(--local-border); color: #7dc47d; }
    .chip.local-chip.active { background: #2d5a2d; border-color: #4a8a4a; color: #aeeaae; }

    /* ── Featured section ── */
    .section-label {
      padding: 18px 24px 8px;
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--muted);
      display: flex; align-items: center; gap: 8px;
    }
    .section-label .pin { color: #7dc47d; }

    /* ── Status / spinner ── */
    #status {
      text-align: center; padding: 60px 24px;
      color: var(--muted); font-size: 15px;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Grids ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px; padding: 0 24px 16px;
    }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 15px; cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, background 0.15s;
      display: flex; flex-direction: column; gap: 9px;
      position: relative; overflow: hidden;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card.playing { border-color: var(--accent); background: #241808; }
    .card.playing::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,107,53,0.1) 0%, transparent 60%);
      pointer-events: none;
    }
    .card.local { background: var(--local); border-color: var(--local-border); }
    .card.local:hover { border-color: #5aaa5a; }
    .card.local.playing { background: #1a3a0f; border-color: #5aaa5a; }

    .local-badge {
      position: absolute; top: 10px; right: 10px;
      background: #2d5a2d; color: #7dc47d;
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; padding: 2px 6px; border-radius: 4px;
    }
    .verified-badge {
      position: absolute; top: 10px; right: 10px;
      background: #1a3a5a; color: #5ab4f0;
      font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; padding: 2px 6px; border-radius: 4px;
    }
    .lang-tag {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 600;
      background: rgba(255,107,53,0.13); color: var(--accent2);
      border-radius: 4px; padding: 2px 7px;
    }
    /* ── Language filter bar ── */
    .lang-bar {
      display: flex; gap: 8px; overflow-x: auto; padding: 8px 24px;
      scrollbar-width: none; background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .lang-bar::-webkit-scrollbar { display: none; }
    .lang-chip {
      flex-shrink: 0; background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer;
      transition: all 0.15s; color: var(--muted); white-space: nowrap;
    }
    .lang-chip:hover { border-color: var(--accent2); color: var(--text); }
    .lang-chip.active { background: rgba(255,107,53,0.2); border-color: var(--accent2); color: var(--accent2); font-weight: 600; }

    .card-logo {
      width: 48px; height: 48px; border-radius: 10px;
      background: var(--surface); display: flex;
      align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
    }
    .card-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .card-logo .fallback { font-size: 20px; font-weight: 800; color: var(--accent); user-select: none; }

    .card-name { font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--text); }
    .card-meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .card-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }
    .bitrate-tag {
      font-size: 10px; padding: 1px 5px; border-radius: 3px;
      background: var(--border); color: var(--muted);
    }

    .play-badge { display: none; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
    .card.playing .play-badge { display: flex; }
    .wave { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
    .wave span { width: 3px; border-radius: 2px; background: var(--accent); animation: wave 0.8s ease-in-out infinite alternate; }
    .wave span:nth-child(1) { height: 4px; animation-delay: 0s; }
    .wave span:nth-child(2) { height: 10px; animation-delay: 0.15s; }
    .wave span:nth-child(3) { height: 6px; animation-delay: 0.3s; }
    .wave span:nth-child(4) { height: 12px; animation-delay: 0.1s; }
    @keyframes wave { to { transform: scaleY(0.3); } }

    /* ── Player bar ── */
    #player-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--player-h); background: #12121c;
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 24px; gap: 18px; z-index: 100;
    }
    #pLogo { width: 48px; height: 48px; border-radius: 10px; background: var(--surface); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    #pLogo img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    #player-info { flex: 1; min-width: 0; }
    #player-name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #player-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    #player-controls { display: flex; align-items: center; gap: 14px; }
    .ctrl-btn {
      background: none; border: none; color: var(--muted);
      cursor: pointer; padding: 6px; border-radius: 50%;
      transition: all 0.15s; display: flex; align-items: center; justify-content: center;
    }
    .ctrl-btn:hover { color: var(--text); background: var(--card); }
    .ctrl-btn.primary { width: 44px; height: 44px; background: var(--accent); color: #fff; }
    .ctrl-btn.primary:hover { background: var(--accent2); }

    #player-status { font-size: 12px; color: var(--muted); min-width: 76px; text-align: right; }
    #player-status.live   { color: #4ade80; }
    #player-status.loading{ color: var(--accent); animation: pulse 1s ease-in-out infinite; }
    #player-status.error  { color: #f87171; }
    #player-status.retry  { color: #facc15; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .volume-wrap { display: flex; align-items: center; gap: 8px; }
    #volume {
      -webkit-appearance: none; width: 80px; height: 4px;
      border-radius: 2px; background: var(--border); outline: none; cursor: pointer;
    }
    #volume::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--accent); cursor: pointer;
    }
    audio { display: none; }

    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); padding: 0 12px 12px; }
      header { padding: 10px 12px; }
      .state-bar { padding: 10px 12px; }
      #player-bar { padding: 0 12px; gap: 12px; }
      .volume-wrap { display: none; }
      .section-label { padding: 14px 12px 6px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Nagesh<span>Radio</span></div>
  <input id="search" type="search" placeholder="Search stations, cities, languages…" />
</header>

<div class="country-bar" id="countryBar">
  <div class="country-tab active" data-country="India">🇮🇳 India</div>
  <div class="country-tab" data-country="The United States Of America">🇺🇸 USA</div>
  <div class="country-tab" data-country="Indonesia">🇮🇩 Indonesia</div>
</div>

<div class="state-bar" id="stateBar">
  <div class="chip active" data-state="all">All</div>
  <div class="chip local-chip" data-state="__local__">📍 Mangalore &amp; Udupi</div>
</div>

<div class="lang-bar" id="langBar" style="display:none">
  <div class="lang-chip active" data-lang="all">All Languages</div>
</div>

<div id="status"><div class="spinner"></div><div>Loading stations…</div></div>
<div id="main" style="display:none"></div>

<div id="player-bar">
  <div id="pLogo"><span style="font-size:20px;color:var(--accent)">♪</span></div>
  <div id="player-info">
    <div id="player-name">Select a station</div>
    <div id="player-meta">Nagesh Radio</div>
  </div>
  <div id="player-controls">
    <div id="player-status">—</div>
    <button class="ctrl-btn primary" id="playBtn" onclick="togglePlay()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path id="playIcon" d="M8 5v14l11-7z"/>
      </svg>
    </button>
  </div>
  <div class="volume-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--muted)">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
    </svg>
    <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8" oninput="setVolume(this.value)" />
  </div>
</div>
<audio id="audio" preload="none"></audio>

<script>
// ── HLS player ────────────────────────────────────────────────────────────────
const audio = document.getElementById('audio');
let hlsInst = null;

function isHLS(url) { return url && (url.includes('.m3u8') || url.includes('hls')); }

function attachStream(url) {
  if (hlsInst) { hlsInst.destroy(); hlsInst = null; }
  audio.pause(); audio.src = '';
  if (Hls.isSupported() && isHLS(url)) {
    hlsInst = new Hls({
      maxBufferLength: 8, maxMaxBufferLength: 20, lowLatencyMode: true,
      liveSyncDurationCount: 2, liveMaxLatencyDurationCount: 6,
      manifestLoadingTimeOut: 8000, manifestLoadingMaxRetry: 3,
      levelLoadingTimeOut: 8000, fragLoadingTimeOut: 12000, startLevel: -1,
    });
    hlsInst.loadSource(url);
    hlsInst.attachMedia(audio);
    hlsInst.on(Hls.Events.MANIFEST_PARSED, () => audio.play().catch(() => {}));
    hlsInst.on(Hls.Events.ERROR, (_, d) => {
      if (d.fatal) { setStatus('error', '✕ Error'); updatePlayIcon(false); playing = false; }
    });
  } else if (audio.canPlayType('application/vnd.apple.mpegurl') && isHLS(url)) {
    audio.src = url; audio.play().catch(() => {});
  } else {
    audio.src = url; audio.play().catch(() => {});
  }
}

// ── Stall detection ───────────────────────────────────────────────────────────
let lastTime = 0, stallTimer = null;
function startStallWatch() {
  clearInterval(stallTimer); lastTime = audio.currentTime;
  stallTimer = setInterval(() => {
    if (!playing) return;
    if (audio.currentTime === lastTime && !audio.paused) {
      setStatus('retry', '↺ Reconnecting…');
      if (currentStation) attachStream(currentStation.url_resolved || currentStation.url);
    }
    lastTime = audio.currentTime;
  }, 8000);
}

// ── App state ─────────────────────────────────────────────────────────────────
const COUNTRIES = {
  'India':                       { flag: '🇮🇳', label: 'India',     hasLocal: true  },
  'The United States Of America':{ flag: '🇺🇸', label: 'USA',       hasLocal: false },
  'Indonesia':                   { flag: '🇮🇩', label: 'Indonesia',  hasLocal: false },
};

let activeCountry = 'India';
// Hardcoded verified Mangalore stations (confirmed working stream URLs)
const MANGALORE_HARDCODED = [
  {
    stationuuid: 'hc-air-mangalore',
    name: 'AIR Mangalore (Akashvani)',
    state: 'Karnataka',
    language: 'kannada,tulu,konkani',
    tags: 'mangalore,news,mangaluru,air,akashvani',
    url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio073/playlist.m3u8',
    url_resolved: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio073/playlist.m3u8',
    favicon: '',
    bitrate: 48,
    _isLocal: true,
    _verified: true,
  },
  {
    stationuuid: 'hc-amchi-konkani',
    name: 'Radio AmchiKONKANI',
    state: 'Karnataka',
    language: 'konkani',
    tags: 'mangalore,konkani,coastal,christian,devotional',
    url: 'http://178.32.107.151:3711/stream',
    url_resolved: 'http://178.32.107.151:3711/stream',
    favicon: '',
    bitrate: 0,
    _isLocal: true,
    _verified: true,
  },
];

let cache = {};
let stations = [];
let localPicks = [];
let filtered = [];
let activeState = 'all';
let activeLang = 'all';
let currentId = null;
let currentStation = null;
let playing = false;
let retryCount = 0;

// ── API ───────────────────────────────────────────────────────────────────────
const MIRRORS = [
  'https://de1.api.radio-browser.info',
  'https://nl1.api.radio-browser.info',
  'https://at1.api.radio-browser.info',
];
async function apiFetch(path) {
  for (const base of MIRRORS) {
    try {
      const r = await fetch(base + path, { headers: { 'User-Agent': 'NageshRadioApp/1.0' } });
      const j = await r.json();
      if (j && j.length) return j;
    } catch (_) {}
  }
  return [];
}

// ── Load stations for a country ───────────────────────────────────────────────
async function loadCountry(country) {
  if (cache[country]) {
    ({ stations, localPicks } = cache[country]);
    buildStateChips(); applyFilter();
    document.getElementById('status').style.display = 'none';
    document.getElementById('main').style.display = '';
    return;
  }

  document.getElementById('main').style.display = 'none';
  document.getElementById('status').style.display = '';
  document.getElementById('status').innerHTML = '<div class="spinner"></div><div>Loading stations…</div>';

  const enc = encodeURIComponent(country);
  let fetches = [
    apiFetch(`/json/stations/bycountry/${enc}?limit=500&hidebroken=true&order=votes&reverse=true`),
  ];
  if (country === 'India') {
    fetches = fetches.concat([
      apiFetch('/json/stations/search?country=India&name=mangalore&hidebroken=true'),
      apiFetch('/json/stations/search?country=India&name=udupi&hidebroken=true'),
      apiFetch('/json/stations/search?country=India&name=mangaluru&hidebroken=true'),
      apiFetch('/json/stations/search?country=India&name=misty&hidebroken=true'),
      apiFetch('/json/stations/search?country=India&name=air+mangalore&hidebroken=true'),
    ]);
  }

  const results = await Promise.all(fetches);
  const main = results[0];

  if (!main.length) {
    document.getElementById('status').innerHTML = '<div style="color:#f87171">Could not load. Check your connection.</div>';
    return;
  }

  // Deduplicate by name
  const seen = new Map();
  for (const s of main) {
    const k = s.name.trim().toLowerCase();
    if (!seen.has(k) || s.votes > seen.get(k).votes) seen.set(k, s);
  }
  stations = [...seen.values()];
  localPicks = [];

  if (country === 'India') {
    const localRaw = [...results[1], ...results[2], ...results[3], ...results[4], ...results[5]];
    const localSeen = new Map();
    for (const s of localRaw) {
      if (!localSeen.has(s.stationuuid)) { s._isLocal = true; localSeen.set(s.stationuuid, s); }
    }
    for (const s of stations) {
      const txt = (s.name + ' ' + (s.tags||'')).toLowerCase();
      if ((txt.includes('mangalore') || txt.includes('mangaluru') || txt.includes('udupi') ||
           txt.includes('tulu') || txt.includes('misty')) && !localSeen.has(s.stationuuid)) {
        s._isLocal = true; localSeen.set(s.stationuuid, s);
      }
    }
    // Merge hardcoded verified stations first, then API results
    const mergedLocal = new Map();
    for (const s of MANGALORE_HARDCODED) mergedLocal.set(s.stationuuid, s);
    for (const [k, v] of localSeen) if (!mergedLocal.has(k)) mergedLocal.set(k, v);
    localPicks = [...mergedLocal.values()];
    for (const s of stations) { if (localSeen.has(s.stationuuid)) s._isLocal = true; }
  }

  cache[country] = { stations, localPicks };
  activeLang = 'all';
  buildStateChips();
  buildLangChips();
  applyFilter();
  document.getElementById('status').style.display = 'none';
  document.getElementById('main').style.display = '';
}

// ── Country tabs ──────────────────────────────────────────────────────────────
document.querySelectorAll('.country-tab').forEach(tab => {
  tab.onclick = () => {
    const c = tab.dataset.country;
    if (c === activeCountry) return;
    activeCountry = c;
    document.querySelectorAll('.country-tab').forEach(t => t.classList.toggle('active', t.dataset.country === c));
    // Show/hide the local chip
    const localChip = document.querySelector('[data-state="__local__"]');
    localChip.style.display = COUNTRIES[c].hasLocal ? '' : 'none';
    // Reset state filter
    activeState = 'all';
    document.getElementById('search').value = '';
    loadCountry(c);
  };
});

// ── State chips ───────────────────────────────────────────────────────────────
function buildStateChips() {
  const stBar = document.getElementById('stateBar');
  // Remove old dynamic chips (keep first two: All + Local)
  [...stBar.querySelectorAll('.chip:not([data-state="all"]):not([data-state="__local__"])')].forEach(c => c.remove());

  const statesSet = new Set();
  for (const s of stations) { const st = (s.state||'').trim(); if (st) statesSet.add(st); }
  for (const st of [...statesSet].sort()) {
    const d = document.createElement('div');
    d.className = 'chip'; d.dataset.state = st; d.textContent = st;
    d.onclick = () => selectState(st);
    stBar.appendChild(d);
  }
  // Sync active highlight
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.state === activeState));
}

function selectState(st) {
  activeState = st;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.state === st));
  applyFilter();
}
document.querySelector('[data-state="all"]').onclick    = () => selectState('all');
document.querySelector('[data-state="__local__"]').onclick = () => selectState('__local__');

// ── Language chips ────────────────────────────────────────────────────────────
function buildLangChips() {
  const bar = document.getElementById('langBar');
  [...bar.querySelectorAll('.lang-chip:not([data-lang="all"])')].forEach(c => c.remove());

  const langSet = new Set();
  for (const s of stations) {
    (s.language || '').split(',').forEach(l => { const t = l.trim(); if (t) langSet.add(t); });
  }

  const sorted = [...langSet].sort();
  if (!sorted.length) { bar.style.display = 'none'; return; }

  bar.style.display = 'flex';
  for (const lang of sorted) {
    const d = document.createElement('div');
    d.className = 'lang-chip'; d.dataset.lang = lang;
    d.textContent = capitalise(lang);
    d.onclick = () => selectLang(lang);
    bar.appendChild(d);
  }
  document.querySelector('.lang-chip[data-lang="all"]').classList.add('active');
}

function selectLang(lang) {
  activeLang = lang;
  document.querySelectorAll('.lang-chip').forEach(c => c.classList.toggle('active', c.dataset.lang === lang));
  applyFilter();
}
document.querySelector('.lang-chip[data-lang="all"]').onclick = () => selectLang('all');

function capitalise(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// ── Filter ────────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => applyFilter(e.target.value));

function applyFilter(q = document.getElementById('search').value) {
  const ql = q.toLowerCase();
  const matchLang = s => activeLang === 'all' ||
    (s.language || '').split(',').map(l => l.trim()).includes(activeLang);

  if (activeState === '__local__') {
    filtered = localPicks.filter(s =>
      matchLang(s) && (!q || (s.name+' '+(s.state||'')+' '+(s.language||'')+' '+(s.tags||'')).toLowerCase().includes(ql))
    );
  } else {
    filtered = stations.filter(s => {
      const matchState = activeState === 'all' || (s.state||'').trim() === activeState;
      const matchQ = !q || (s.name+' '+(s.state||'')+' '+(s.language||'')+' '+(s.tags||'')).toLowerCase().includes(ql);
      return matchState && matchQ && matchLang(s);
    });
  }
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const main = document.getElementById('main');
  if (!filtered.length) {
    main.innerHTML = '<div style="text-align:center;padding:60px 24px;color:var(--muted)">No stations found.</div>';
    return;
  }
  const countryLabel = COUNTRIES[activeCountry]?.label || activeCountry;
  let html = '';
  if (activeState === 'all' || activeState === '__local__') {
    const locals = activeState === '__local__' ? filtered : filtered.filter(s => s._isLocal);
    if (locals.length && COUNTRIES[activeCountry].hasLocal) {
      html += `<div class="section-label"><span class="pin">📍</span> Mangalore &amp; Udupi — Local Picks</div>`;
      html += `<div class="grid">${locals.map(cardHTML).join('')}</div>`;
    }
    if (activeState === 'all') {
      const rest = filtered.filter(s => !s._isLocal);
      if (rest.length) {
        html += `<div class="section-label">All ${countryLabel}</div>`;
        html += `<div class="grid">${rest.map(cardHTML).join('')}</div>`;
      }
    }
  } else {
    html += `<div class="grid">${filtered.map(cardHTML).join('')}</div>`;
  }
  main.innerHTML = html;
}

function cardHTML(s) {
  const id = esc(s.stationuuid);
  const br = s.bitrate ? `<span class="bitrate-tag">${s.bitrate}k</span>` : '';
  const localBadge = s._verified ? '<div class="verified-badge">✓ Verified</div>' : (s._isLocal ? '<div class="local-badge">LOCAL</div>' : '');
  const fallback = esc(s.name.trim().charAt(0).toUpperCase());
  const imgTag = s.favicon
    ? `<img src="${esc(s.favicon)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const langs = (s.language || '').split(',').map(l => l.trim()).filter(Boolean);
  const langTag = langs.length
    ? `<span class="lang-tag">🗣 ${esc(langs.map(capitalise).join(', '))}</span>`
    : '';
  const stateLine = [s.state, s.tags ? s.tags.split(',')[0].trim() : ''].filter(Boolean).join(' · ');
  return `
    <div class="card${currentId===s.stationuuid?' playing':''}${s._isLocal?' local':''}"
         onclick="selectStation('${id}')" id="card-${id}">
      ${localBadge}
      <div class="card-logo">
        ${imgTag}
        <span class="fallback" ${s.favicon?'style="display:none"':''}>${fallback}</span>
      </div>
      <div class="card-name">${esc(s.name.trim())}</div>
      ${langTag}
      <div class="card-meta">
        ${stateLine ? `<span>${esc(stateLine)}</span>` : ''}
        ${stateLine && br ? '<span class="dot"></span>' : ''}
        ${br}
      </div>
      <div class="play-badge">
        <div class="wave"><span></span><span></span><span></span><span></span></div>
        Live
      </div>
    </div>`;
}

function esc(v) {
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Playback ──────────────────────────────────────────────────────────────────
function selectStation(id) {
  const pool = [...stations, ...localPicks];
  const s = pool.find(x => x.stationuuid === id);
  if (!s) return;

  if (currentId) { const p = document.getElementById('card-'+currentId); if (p) p.classList.remove('playing'); }
  currentId = id; currentStation = s; retryCount = 0;
  const card = document.getElementById('card-'+id);
  if (card) card.classList.add('playing');

  const pLogo = document.getElementById('pLogo');
  pLogo.innerHTML = s.favicon
    ? `<img src="${esc(s.favicon)}" style="width:100%;height:100%;object-fit:cover;border-radius:10px"
            onerror="this.outerHTML='<span style=font-size:20px;color:var(--accent)>${esc(s.name.charAt(0).toUpperCase())}</span>'">`
    : `<span style="font-size:20px;color:var(--accent)">${esc(s.name.charAt(0).toUpperCase())}</span>`;
  document.getElementById('player-name').textContent = s.name.trim();
  document.getElementById('player-meta').textContent =
    [s.state, s.tags?s.tags.split(',')[0].trim():'', s.bitrate?s.bitrate+'kbps':''].filter(Boolean).join(' · ')
    || COUNTRIES[activeCountry]?.label || activeCountry;

  setStatus('loading', '⏳ Connecting…'); updatePlayIcon(false); playing = false;
  audio.volume = parseFloat(document.getElementById('volume').value);
  attachStream(s.url_resolved || s.url);
  startStallWatch();
}

function togglePlay() {
  if (!currentId) return;
  if (playing) {
    audio.pause(); updatePlayIcon(false); setStatus('', '—'); playing = false; clearInterval(stallTimer);
  } else {
    setStatus('loading', '⏳ Connecting…');
    attachStream(currentStation.url_resolved || currentStation.url);
    startStallWatch();
  }
}

function updatePlayIcon(p) {
  document.getElementById('playIcon').setAttribute('d', p ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z' : 'M8 5v14l11-7z');
}
function setStatus(cls, text) { const el = document.getElementById('player-status'); el.className = cls; el.textContent = text; }
function setVolume(v) { audio.volume = v; }

audio.addEventListener('playing', () => { setStatus('live', '● LIVE'); updatePlayIcon(true); playing = true; });
audio.addEventListener('waiting', () => { if (playing) setStatus('loading', '⏳ Buffering…'); });
audio.addEventListener('error', () => {
  if (retryCount < 2) {
    retryCount++;
    setStatus('retry', `↺ Retry ${retryCount}…`);
    setTimeout(() => { if (currentStation) attachStream(currentStation.url_resolved || currentStation.url); }, 2000);
  } else { setStatus('error', '✕ Failed'); updatePlayIcon(false); playing = false; }
});
audio.addEventListener('pause', () => { if (!playing) updatePlayIcon(false); });

loadCountry('India');
</script>
</body>
</html>
